<style>
  :root {
    --bg: #FAF8F4;
    --surface: #FFFFFF;
    --ink: #1C1E24;
    --muted: #6B7078;
    --line: #E7E3DB;
    --accent: #2A4CDB;
    --accent-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151A;
      --surface: #1D1F26;
      --ink: #EFEDE8;
      --muted: #9B9FA8;
      --line: #2C2E37;
      --accent: #5B7CFF;
      --accent-ink: #0E0F13;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151A;
    --surface: #1D1F26;
    --ink: #EFEDE8;
    --muted: #9B9FA8;
    --line: #2C2E37;
    --accent: #5B7CFF;
    --accent-ink: #0E0F13;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding-inline: 16px;
    padding-block: 48px;
  }
  main {
    width: 100%;
    max-width: 380px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .role {
    font-size: 15px;
    color: var(--muted);
    margin: 0;
    line-height: 1.4;
  }
  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 0;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
    font-size: 15px;
  }
  .row svg {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--muted);
  }
  .row span {
    overflow-wrap: anywhere;
  }
  .save {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    border-radius: 12px;
    padding: 14px 20px;
    margin-top: 4px;
  }
  .save svg { width: 18px; height: 18px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 18px;
  }
</style>
